services:
  # ----------------------------------------------------
  # Express.js Backend API
  # ----------------------------------------------------
  - type: web
    name: rwmanage-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npm run db:deploy
    startCommand: FRONTEND_URL=https://$FRONTEND_HOST node dist/src/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rwmanage-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 1d
      - key: NODE_ENV
        value: production
      - key: FRONTEND_HOST
        fromService:
          name: rwmanage-frontend
          type: web
          property: host

  # ----------------------------------------------------
  # Next.js Frontend App
  # ----------------------------------------------------
  - type: web
    name: rwmanage-frontend
    runtime: node
    rootDir: frontend
    buildCommand: echo "NEXT_PUBLIC_API_URL=https://$BACKEND_HOST/api" > .env.production && npm install && npm run build
    startCommand: npx next start
    envVars:
      - key: BACKEND_HOST
        fromService:
          name: rwmanage-backend
          type: web
          property: host

databases:
  # ----------------------------------------------------
  # PostgreSQL Database Instance
  # ----------------------------------------------------
  - name: rwmanage-db
    databaseName: rwmanage
    user: rwmanage_user
    plan: free
