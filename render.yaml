services:
  # ----------------------------------------------------
  # Express.js Backend API
  # ----------------------------------------------------
  - type: web
    name: rwmanage-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run db:deploy && node dist/src/server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 1d
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://rwmanage.onrender.com

  # ----------------------------------------------------
  # Next.js Frontend App
  # ----------------------------------------------------
  - type: web
    name: rwmanage
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx next start
    envVars:
      - key: BACKEND_URL
        fromService:
          name: rwmanage-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
