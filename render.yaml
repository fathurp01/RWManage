services:
  # ----------------------------------------------------
  # Express.js Backend API
  # ----------------------------------------------------
  - type: web
    name: rwmanage-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run db:deploy && node dist/src/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rwmanage-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 1d
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://rwmanage-frontend.onrender.com

  # ----------------------------------------------------
  # Next.js Frontend App
  # ----------------------------------------------------
  - type: web
    name: rwmanage-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: echo "NEXT_PUBLIC_API_URL=$BACKEND_URL/api" > .env.production && npm install --include=dev && npm run build
    startCommand: npx next start
    envVars:
      - key: BACKEND_URL
        fromService:
          name: rwmanage-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # ----------------------------------------------------
  # PostgreSQL Database Instance
  # ----------------------------------------------------
  - name: rwmanage-db
    databaseName: rwmanage
    user: rwmanage_user
    plan: free
